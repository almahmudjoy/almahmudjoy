<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160">
  <defs>
    <clipPath id="tl"><polygon points="0,0 90,0 0,90"/></clipPath>
    <clipPath id="br"><polygon points="700,160 610,160 700,70"/></clipPath>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#111111"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FFD400" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="700" height="160" fill="#FFD400"/>
  <rect width="700" height="160" fill="url(#hatch)" clip-path="url(#tl)"/>
  <rect width="700" height="160" fill="url(#hatch)" clip-path="url(#br)"/>

  <line x1="175" y1="10" x2="175" y2="150" stroke="#111111" stroke-width="3"/>
  <line x1="350" y1="10" x2="350" y2="150" stroke="#111111" stroke-width="3"/>
  <line x1="525" y1="10" x2="525" y2="150" stroke="#111111" stroke-width="3"/>

  <!-- PRAY (mosque) -->
  <g transform="translate(62,22) scale(0.85)">
    <path d="M14,40 A18,18 0 0 1 50,40 Z" fill="#111111"/>
    <rect x="10" y="40" width="44" height="20" fill="#111111"/>
    <path d="M27,60 V47 A5,5 0 0 1 37,47 V60 Z" fill="#FFD400"/>
    <rect x="4" y="20" width="5" height="40" fill="#111111"/>
    <circle cx="6.5" cy="18" r="4.5" fill="#111111"/>
    <rect x="55" y="20" width="5" height="40" fill="#111111"/>
    <circle cx="57.5" cy="18" r="4.5" fill="#111111"/>
    <circle cx="32" cy="9" r="3.2" fill="#111111"/>
    <rect x="30.5" y="12" width="3" height="6" fill="#111111"/>
  </g>
  <text x="87" y="122" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="20" fill="#111111">PRAY</text>

  <!-- CODE -->
  <g transform="translate(262,22)">
    <text x="0" y="46" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="42" fill="#111111">&lt;/&gt;</text>
  </g>
  <text x="262" y="122" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="20" fill="#111111">CODE</text>

  <!-- SLEEP (bed) -->
  <g transform="translate(413,20) scale(0.85)">
    <rect x="6" y="20" width="6" height="30" fill="#111111"/>
    <rect x="12" y="34" width="46" height="10" rx="2" fill="#111111"/>
    <rect x="14" y="27" width="15" height="9" rx="3" fill="#111111"/>
    <rect x="6" y="44" width="52" height="4" fill="#111111"/>
    <rect x="10" y="48" width="3" height="8" fill="#111111"/>
    <rect x="51" y="48" width="3" height="8" fill="#111111"/>
    <text x="46" y="20" font-family="Verdana, Arial, sans-serif" font-weight="700" font-style="italic" font-size="9" fill="#111111">z</text>
    <text x="51" y="14" font-family="Verdana, Arial, sans-serif" font-weight="700" font-style="italic" font-size="11" fill="#111111">Z</text>
    <text x="57" y="8" font-family="Verdana, Arial, sans-serif" font-weight="700" font-style="italic" font-size="13" fill="#111111">Z</text>
  </g>
  <text x="437" y="122" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="20" fill="#111111">SLEEP</text>

  <!-- REPEAT (loop) -->
  <g transform="translate(587,22) scale(0.85)">
    <path d="M14,32 A18,18 0 0 1 44,16" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <polygon points="38,8 52,11 43,22" fill="#111111"/>
    <path d="M50,32 A18,18 0 0 1 20,48" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <polygon points="26,56 12,53 21,42" fill="#111111"/>
  </g>
  <text x="612" y="122" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="20" fill="#111111">REPEAT</text>
</svg>
